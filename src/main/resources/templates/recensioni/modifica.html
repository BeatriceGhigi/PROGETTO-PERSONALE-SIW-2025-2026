<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(title='Modifica recensione')}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container" style="max-width: 600px;">
    <h1 class="mb-4">Modifica la tua recensione</h1>

    <form th:action="@{'/recensioni/' + ${recensione.id} + '/modifica'}" th:object="${recensione}" method="post">

        <div class="mb-3">
            <label for="voto" class="form-label">Voto (1-5)</label>
            <input type="number" id="voto" th:field="*{voto}" min="1" max="5" class="form-control" />
            <span class="text-danger" th:if="${#fields.hasErrors('voto')}" th:errors="*{voto}"></span>
        </div>

        <div class="mb-3">
            <label for="commento" class="form-label">Commento</label>
            <textarea id="commento" th:field="*{commento}" rows="4" class="form-control"></textarea>
            <span class="text-danger" th:if="${#fields.hasErrors('commento')}" th:errors="*{commento}"></span>
        </div>

        <button type="submit" class="btn btn-primary">Salva modifiche</button>
    </form>

    <a th:href="@{'/prodotti/' + ${recensione.prodotto.id}}" class="btn btn-link mt-3">Annulla</a>
</div>

</body>
</html>
