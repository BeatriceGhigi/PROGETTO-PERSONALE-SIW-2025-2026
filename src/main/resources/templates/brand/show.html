<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head(title=${brand.nome})}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 th:text="${brand.nome}">Nome brand</h1>
        <a sec:authorize="hasAuthority('ADMIN')"
           th:href="@{'/admin/brand/' + ${brand.id} + '/modifica'}"
           class="btn btn-outline-secondary">
            Modifica
        </a>
    </div>

    <p th:text="${brand.descrizione}">Descrizione brand</p>
    <p>
        <strong>Paese:</strong> <span th:text="${brand.paese}">Paese</span><br/>
        <strong>Sito web:</strong>
        <a th:if="${brand.sitoWeb}" th:href="${brand.sitoWeb}" th:text="${brand.sitoWeb}" target="_blank">sito</a>
    </p>

    <h2 class="mt-4">Prodotti di questo brand</h2>
    <div class="list-group">
        <a th:each="prodotto : ${brand.prodotti}"
           th:href="@{'/prodotti/' + ${prodotto.id}}"
           class="list-group-item list-group-item-action d-flex justify-content-between">
            <span th:text="${prodotto.nome}">Nome prodotto</span>
            <span class="badge bg-secondary" th:text="${prodotto.prezzo} + ' €'">0.00 €</span>
        </a>
    </div>

    <a th:href="@{/brand}" class="btn btn-link mt-3">Torna ai brand</a>
</div>

</body>
</html>
