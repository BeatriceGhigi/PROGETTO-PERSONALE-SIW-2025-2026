<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Prodotti</title>
</head>
<body>
    <h1>Lista prodotti</h1>

    <div>
        <ul>
            <li th:each="prodotto : ${prodotti}">
                <a th:href="@{'/prodotti/' + ${prodotto.id}}"
                   th:text="${prodotto.nome}">Nome prodotto</a>

                

                <a th:href="@{/utenti/1/wishlist/add/{prodottoId}(prodottoId=${prodotto.id})}">
                    Aggiungi alla wishlist
                </a>
            </li>
        </ul>
    </div>
</body>
</html>
